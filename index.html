<!DOCTYPE html>
<html lang="zh-TW">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代 UI 設計展示</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <section class="hero">
            <div class="loading-animation">
                <div class="loading-container">
                    <div class="cat" id="loadingCat">
                        <div class="cat-head">
                            <div class="cat-ear cat-ear-left"></div>
                            <div class="cat-ear cat-ear-right"></div>
                            <div class="cat-eye cat-eye-left"></div>
                            <div class="cat-eye cat-eye-right"></div>
                            <div class="cat-nose"></div>
                            <div class="cat-mouth"></div>
                        </div>
                        <div class="cat-body"></div>
                        <div class="cat-leg cat-leg-1"></div>
                        <div class="cat-leg cat-leg-2"></div>
                        <div class="cat-leg cat-leg-3"></div>
                        <div class="cat-leg cat-leg-4"></div>
                        <div class="cat-tail"></div>
                    </div>
                    <div class="loading-track">
                        <div class="loading-progress"></div>
                    </div>
                    <div class="loading-percent" id="loadingPercent">0%</div>
                </div>
            </div>
        </section>
        <div class="game-screen hidden" id="gameScreen">
            <div class="hud">
                <div class="affection">
                    <div class="heart-box">

                        <div class="heart-liquid" id="heartLiquid">
                            ❤️
                        </div>
                    </div>
                </div>
            </div>
            <div class="game-stage" id="gameStage">
                <div class="cat" id="gameCat">
                    <div class="cat-head">
                        <div class="cat-ear cat-ear-left"></div>
                        <div class="cat-ear cat-ear-right"></div>
                        <div class="cat-eye cat-eye-left"></div>
                        <div class="cat-eye cat-eye-right"></div>
                        <div class="cat-nose"></div>
                        <div class="cat-mouth"></div>
                    </div>
                    <div class="cat-body"></div>
                    <div class="cat-leg cat-leg-1"></div>
                    <div class="cat-leg cat-leg-2"></div>
                    <div class="cat-leg cat-leg-3"></div>
                    <div class="cat-leg cat-leg-4"></div>
                    <div class="cat-tail"></div>
                </div>
            </div>
            <button id="feedBtn" class="feed-btn">餵食</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
